<svg viewBox="0 0 900 178" role="img" aria-label="Recovering the absolute pattern" data-figure="" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="900" height="178" fill="#ffffff"/><defs><marker id="fr-arrow-r3" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="rgb(87, 96, 106)"></path></marker></defs><g data-figure-box=""><rect x="12" y="14" width="210" height="52" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(208, 215, 222)" stroke-width="1"></rect><text x="22" y="35" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Seven ratios</text><text x="22" y="54" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">S/B, H/B, B/D, T/B, Pf</text></g><g data-figure-box=""><rect x="12" y="78" width="210" height="66" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(154, 103, 0)" stroke-width="2"></rect><text x="22" y="99" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Hole diameter D</text><text x="22" y="118" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">from the source prose,</text><text x="22" y="132" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">8 of 10 sites</text></g><g data-figure-box=""><rect x="262" y="39" width="200" height="80" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(9, 105, 218)" stroke-width="2"></rect><text x="272" y="60" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Pattern in metres</text><text x="272" y="79" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">B = (B/D)·D</text><text x="272" y="93" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">S, H, T from ratios</text><text x="272" y="107" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">V = B·S·H, Q = Pf·V</text></g><g data-figure-box=""><rect x="502" y="14" width="386" height="66" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(26, 127, 55)" stroke-width="2"></rect><text x="512" y="35" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Checked against the prose</text><text x="512" y="54" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">15 stated constraints, 9 sites,</text><text x="512" y="68" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">all satisfied</text></g><g data-figure-box=""><rect x="502" y="92" width="386" height="66" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(207, 34, 46)" stroke-width="2"></rect><text x="512" y="113" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Cannot be reconstructed</text><text x="512" y="132" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Miami: no diameter stated,</text><text x="512" y="146" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">6 blasts, classical arms abstain</text></g><line x1="222" y1="40" x2="260" y2="67" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r3)"></line><line x1="222" y1="111" x2="260" y2="91" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r3)"></line><line x1="462" y1="67" x2="500" y2="47" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r3)"></line><line x1="462" y1="91" x2="500" y2="125" stroke="rgb(87, 96, 106)" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#fr-arrow-r3)"></line></svg>
