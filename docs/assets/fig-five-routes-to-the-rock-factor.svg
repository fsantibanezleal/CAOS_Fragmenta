<svg viewBox="0 0 900 382" role="img" aria-label="Five routes to the rock factor" data-figure="" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="900" height="382" fill="#ffffff"/><defs><marker id="fr-arrow-r2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="rgb(87, 96, 106)"></path></marker></defs><g data-figure-box=""><rect x="12" y="12" width="230" height="66" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(208, 215, 222)" stroke-width="1"></rect><text x="22" y="33" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Lilly, as printed in 2010</text><text x="22" y="52" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">BI = 0.5(RMD+JPS+JPO</text><text x="22" y="66" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">+RDI+0.05·UCS)</text></g><g data-figure-box=""><rect x="12" y="90" width="230" height="52" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(154, 103, 0)" stroke-width="2"></rect><text x="22" y="111" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Lilly, as printed in 2019</text><text x="22" y="130" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">strength = UCS/3 or /5</text></g><g data-figure-box=""><rect x="12" y="154" width="230" height="52" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(208, 215, 222)" stroke-width="1"></rect><text x="22" y="175" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Protodyakonov lookup</text><text x="22" y="194" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">five bands, A = 3 to 13</text></g><g data-figure-box=""><rect x="12" y="218" width="230" height="66" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(26, 127, 55)" stroke-width="2"></rect><text x="22" y="239" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Recovered per site</text><text x="22" y="258" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">invert x50 on the</text><text x="22" y="272" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">published prediction</text></g><g data-figure-box=""><rect x="12" y="296" width="230" height="66" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(9, 105, 218)" stroke-width="2"></rect><text x="22" y="317" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Predicted from E</text><text x="22" y="336" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">line over training sites</text><text x="22" y="350" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">only (transfer arm)</text></g><g data-figure-box=""><rect x="310" y="154" width="200" height="66" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(9, 105, 218)" stroke-width="2"></rect><text x="320" y="175" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Rock factor A</text><text x="320" y="194" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">valid range 0.8 to 22</text><text x="320" y="208" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">x50 is linear in A</text></g><g data-figure-box=""><rect x="580" y="140" width="308" height="94" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(207, 34, 46)" stroke-width="2"></rect><text x="590" y="161" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">How far the routes disagree</text><text x="590" y="180" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">2010 vs 2019 tables: up to</text><text x="590" y="194" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">0.85 in A at UCS 100 MPa</text><text x="590" y="208" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">recovered: within-site</text><text x="590" y="222" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">spread 0.6 to 3.7%</text></g><line x1="242" y1="45" x2="308" y2="167.2" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r2)"></line><line x1="242" y1="116" x2="308" y2="177.1" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r2)"></line><line x1="242" y1="180" x2="308" y2="187" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r2)"></line><line x1="242" y1="251" x2="308" y2="196.89999999999998" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r2)"></line><line x1="242" y1="329" x2="308" y2="206.8" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r2)"></line><line x1="510" y1="187" x2="578" y2="187" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r2)"></line></svg>
