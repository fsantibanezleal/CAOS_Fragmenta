<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 366" width="900" class="arch-svg" role="img" aria-label="Where each thing runs">
  <style>
    .arch-svg text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }
    .arch-svg .bx { fill: #f0f3f6; stroke: #d0d7de; stroke-width: 1.2; }
    .arch-svg .bx-accent { stroke: #0969da; stroke-width: 1.8; }
    .arch-svg .bx-good { stroke: #1a7f37; stroke-width: 1.8; }
    .arch-svg .bx-bad { stroke: #cf222e; stroke-width: 1.8; }
    .arch-svg .bx-warn { stroke: #9a6700; stroke-width: 1.8; }
    .arch-svg .ttl { fill: #1f2328; font-size: 14px; font-weight: 700; }
    .arch-svg .hd { fill: #1f2328; font-size: 12.5px; font-weight: 600; }
    .arch-svg .mu { fill: #57606a; font-size: 10.5px; }
    .arch-svg .nt { fill: #57606a; font-size: 11px; }
    .arch-svg .band { stroke: #d0d7de; stroke-dasharray: 3 4; }
    .arch-svg .flow { fill: none; stroke: #6e7781; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arch-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6e7781"/>
    </marker>
  </defs>
<rect x="0" y="0" width="900" height="366" fill="#ffffff"/>
<text class="ttl" x="22" y="28">Where each thing runs</text>
<text class="hd" x="22.0" y="52">offline</text>
<text class="hd" x="312.0" y="52">committed</text>
<text class="hd" x="602.0" y="52">in the browser</text>
<rect class="bx bx-accent" x="22.0" y="64.0" width="270.0" height="80.0" rx="6"/>
<text class="hd" x="32.0" y="85.0">Engine package</text>
<text class="mu" x="32.0" y="104.0">blastfrag 0.04.000 (PyPI)</text>
<text class="mu" x="32.0" y="118.0">models, corpora, protocols, metrics,</text>
<text class="mu" x="32.0" y="132.0">export</text>
<rect class="bx" x="22.0" y="154.0" width="270.0" height="66.0" rx="6"/>
<text class="hd" x="32.0" y="175.0">Staged bake</text>
<text class="mu" x="32.0" y="194.0">ingest, preprocess, split, features,</text>
<text class="mu" x="32.0" y="208.0">train, infer, evaluate, export, validate</text>
<rect class="bx" x="22.0" y="230.0" width="270.0" height="66.0" rx="6"/>
<text class="hd" x="32.0" y="251.0">Benchmark</text>
<text class="mu" x="32.0" y="270.0">100 draws per random protocol, 10 site</text>
<text class="mu" x="32.0" y="284.0">folds, 2000 site resamples per interval</text>
<rect class="bx" x="312.0" y="64.0" width="270.0" height="66.0" rx="6"/>
<text class="hd" x="322.0" y="85.0">16 case artifacts, 1047 kB</text>
<text class="mu" x="322.0" y="104.0">predictions, refusals with reasons,</text>
<text class="mu" x="322.0" y="118.0">curves</text>
<rect class="bx" x="312.0" y="140.0" width="270.0" height="66.0" rx="6"/>
<text class="hd" x="322.0" y="161.0">Benchmark, 359 kB</text>
<text class="mu" x="322.0" y="180.0">spreads, two supports, intervals, per</text>
<text class="mu" x="322.0" y="194.0">site</text>
<rect class="bx bx-warn" x="312.0" y="216.0" width="270.0" height="52.0" rx="6"/>
<text class="hd" x="322.0" y="237.0">11 model files, 2630 kB</text>
<text class="mu" x="322.0" y="256.0">the fitted arms of each training scope</text>
<rect class="bx bx-good" x="602.0" y="64.0" width="276.0" height="80.0" rx="6"/>
<text class="hd" x="612.0" y="85.0">Live: closed forms</text>
<text class="mu" x="612.0" y="104.0">classical, curves, router, regression, in</text>
<text class="mu" x="612.0" y="118.0">TypeScript; parity-tested on every baked</text>
<text class="mu" x="612.0" y="132.0">blast</text>
<rect class="bx bx-good" x="602.0" y="154.0" width="276.0" height="80.0" rx="6"/>
<text class="hd" x="612.0" y="175.0">Live: fitted models</text>
<text class="mu" x="612.0" y="194.0">network, kernels, trees, stack, refit,</text>
<text class="mu" x="612.0" y="208.0">transfer line, walked from JSON; exact</text>
<text class="mu" x="612.0" y="222.0">against the original fit</text>
<line class="flow" x1="157.0" y1="144.0" x2="157.0" y2="152.0" marker-end="url(#arch-arrow)"/>
<line class="flow" x1="157.0" y1="220.0" x2="157.0" y2="228.0" marker-end="url(#arch-arrow)"/>
<line class="flow" x1="292.0" y1="173.8" x2="310.0" y2="97.0" marker-end="url(#arch-arrow)"/>
<line class="flow" x1="292.0" y1="187.0" x2="310.0" y2="173.0" marker-end="url(#arch-arrow)"/>
<line class="flow" x1="292.0" y1="200.2" x2="310.0" y2="242.0" marker-end="url(#arch-arrow)"/>
<line class="flow" x1="582.0" y1="97.0" x2="600.0" y2="96.0" marker-end="url(#arch-arrow)"/>
<line class="flow" x1="582.0" y1="242.0" x2="600.0" y2="202.0" marker-end="url(#arch-arrow)"/>
<line class="band" x1="22" y1="308.0" x2="878" y2="308.0"/>
<text class="nt" x="22" y="326.0">The deploy copies the committed artifacts and checks their digests; it never trains, never re-bakes and never recomputes a benchmark.</text>
<text class="nt" x="22" y="341.0">Continuous integration installs no training stack.</text>
</svg>
