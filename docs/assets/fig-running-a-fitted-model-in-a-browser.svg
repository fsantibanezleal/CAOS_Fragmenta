<svg viewBox="0 0 900 160" role="img" aria-label="Running a fitted model in a browser" data-figure="" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="900" height="160" fill="#ffffff"/><defs><marker id="fr-arrow-r6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="rgb(87, 96, 106)"></path></marker></defs><g data-figure-box=""><rect x="12" y="30" width="200" height="66" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(208, 215, 222)" stroke-width="1"></rect><text x="22" y="51" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Fitted arm (Python)</text><text x="22" y="70" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">numpy, scikit-learn,</text><text x="22" y="84" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">xgboost</text></g><g data-figure-box=""><rect x="252" y="30" width="240" height="66" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(9, 105, 218)" stroke-width="2"></rect><text x="262" y="51" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Portable JSON</text><text x="262" y="70" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">weights, support vectors,</text><text x="262" y="84" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">trees as four flat arrays</text></g><g data-figure-box=""><rect x="532" y="30" width="200" height="66" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(26, 127, 55)" stroke-width="2"></rect><text x="542" y="51" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Walker (TypeScript)</text><text x="542" y="70" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">inputs rounded to 32 bits</text><text x="542" y="84" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">boosting summed in 32 bits</text></g><g data-figure-box=""><rect x="772" y="30" width="116" height="66" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(154, 103, 0)" stroke-width="2"></rect><text x="782" y="51" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Fixtures</text><text x="782" y="70" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">116 blasts,</text><text x="782" y="84" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">every arm</text></g><line x1="212" y1="63" x2="250" y2="63" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r6)"></line><line x1="492" y1="63" x2="530" y2="63" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r6)"></line><line x1="772" y1="63" x2="734" y2="63" stroke="rgb(87, 96, 106)" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#fr-arrow-r6)"></line><g data-figure-notes=""><line x1="12" y1="114" x2="888" y2="114" stroke="rgb(208, 215, 222)" stroke-dasharray="3 4"></line><text x="12" y="130" fill="rgb(87, 96, 106)" font-size="11" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Agreement is exact for the forest, boosting and stacked models and within 1e-12 relative for the network and the kernels, which is why a</text><text x="12" y="145" fill="rgb(87, 96, 106)" font-size="11" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">learned number that moves when you drag a slider is the fitted model’s number and not an approximation of it.</text></g></svg>
