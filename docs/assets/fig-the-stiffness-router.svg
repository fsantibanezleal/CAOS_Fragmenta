<svg viewBox="0 0 900 251" role="img" aria-label="The stiffness router" data-figure="" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="900" height="251" fill="#ffffff"/><defs><marker id="fr-arrow-r4" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="rgb(87, 96, 106)"></path></marker></defs><g data-figure-box=""><rect x="12" y="60" width="170" height="66" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(208, 215, 222)" stroke-width="1"></rect><text x="22" y="81" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Seven ratios</text><text x="22" y="100" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">S/B H/B B/D T/B</text><text x="22" y="114" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Pf XB E</text></g><g data-figure-box=""><rect x="222" y="60" width="230" height="66" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(9, 105, 218)" stroke-width="2"></rect><text x="232" y="81" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Discriminant L</text><text x="232" y="100" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">4.467 S/B - 0.551 H/B</text><text x="232" y="114" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">- 0.123 B/D + ... + 3.577</text></g><g data-figure-box=""><rect x="560" y="14" width="210" height="66" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(26, 127, 55)" stroke-width="2"></rect><text x="570" y="35" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Group 1, high modulus</text><text x="570" y="54" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">35 blasts, mean 51.1 GPa</text><text x="570" y="68" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">lowest L = 13.067</text></g><g data-figure-box=""><rect x="560" y="106" width="210" height="66" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(26, 127, 55)" stroke-width="2"></rect><text x="570" y="127" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Group 2, low modulus</text><text x="570" y="146" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">62 blasts, mean 17.2 GPa</text><text x="570" y="160" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">highest L = 10.318</text></g><g data-figure-box=""><rect x="800" y="67" width="88" height="52" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(208, 215, 222)" stroke-width="1"></rect><text x="810" y="88" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Its own</text><text x="810" y="107" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">power law</text></g><line x1="182" y1="93" x2="220" y2="93" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r4)"></line><line x1="452" y1="93" x2="558" y2="47" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r4)"></line><line x1="452" y1="93" x2="558" y2="139" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r4)"></line><text x="506" y="39" fill="rgb(31, 35, 40)" font-size="10.5" text-anchor="middle" data-figure-label="" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">L &gt; 11.821</text><text x="506" y="157" fill="rgb(31, 35, 40)" font-size="10.5" text-anchor="middle" data-figure-label="" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">L ≤ 11.821</text><line x1="770" y1="47" x2="798" y2="82.6" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r4)"></line><line x1="770" y1="139" x2="798" y2="103.4" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r4)"></line><g data-figure-notes=""><line x1="12" y1="190" x2="888" y2="190" stroke="rgb(208, 215, 222)" stroke-dasharray="3 4"></line><text x="12" y="206" fill="rgb(87, 96, 106)" font-size="11" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Rule: a blast goes to Group 1 when L is above 11.821, the midpoint between the two group centroids measured on the corpus. It is a real</text><text x="12" y="221" fill="rgb(87, 96, 106)" font-size="11" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">gate rather than a label lookup, so it routes designs the corpus never contained; its coefficients, like the regressions', were fitted by</text><text x="12" y="236" fill="rgb(87, 96, 106)" font-size="11" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">the source on all 97 blasts.</text></g></svg>
