<svg viewBox="0 0 900 190" role="img" aria-label="The published network" data-figure="" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="900" height="190" fill="#ffffff"/><defs><marker id="fr-arrow-r5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="rgb(87, 96, 106)"></path></marker></defs><g data-figure-box=""><rect x="12" y="60" width="150" height="52" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(208, 215, 222)" stroke-width="1"></rect><text x="22" y="81" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Router</text><text x="22" y="100" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">picks the group</text></g><g data-figure-box=""><rect x="192" y="60" width="160" height="66" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(208, 215, 222)" stroke-width="1"></rect><text x="202" y="81" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Min-max scaling</text><text x="202" y="100" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">(x - min)/(max - min)</text><text x="202" y="114" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">training rows only</text></g><g data-figure-box=""><rect x="382" y="30" width="230" height="94" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(9, 105, 218)" stroke-width="2"></rect><text x="392" y="51" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">7-N-1 network, per group</text><text x="392" y="70" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">logistic hidden units</text><text x="392" y="84" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">N = 9 (group 1), 7 (group 2)</text><text x="392" y="98" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Levenberg-Marquardt</text><text x="392" y="112" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">8 networks, seeded</text></g><g data-figure-box=""><rect x="642" y="30" width="246" height="80" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(154, 103, 0)" stroke-width="2"></rect><text x="652" y="51" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Output</text><text x="652" y="70" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">each clamped to [0, 1],</text><text x="652" y="84" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">rescaled, then averaged;</text><text x="652" y="98" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">the spread is reported</text></g><line x1="162" y1="86" x2="190" y2="93" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r5)"></line><line x1="352" y1="93" x2="380" y2="93" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r5)"></line><line x1="612" y1="77" x2="640" y2="77" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r5)"></line><g data-figure-notes=""><line x1="12" y1="144" x2="888" y2="144" stroke="rgb(208, 215, 222)" stroke-dasharray="3 4"></line><text x="12" y="160" fill="rgb(87, 96, 106)" font-size="11" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">The clamp is part of the published design and has a consequence across sites: a network trained without a coarse campaign cannot predict a</text><text x="12" y="175" fill="rgb(87, 96, 106)" font-size="11" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">size above the coarsest training blast. The two Reocin campaigns, the coarsest in the corpus, are where that bites.</text></g></svg>
