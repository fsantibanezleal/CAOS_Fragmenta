l="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Live: closed forms</text><text x="622" y="134" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">TypeScript, parity-tested</text></g><g data-figure-box=""><rect x="612" y="158" width="276" height="66" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(26, 127, 55)" stroke-width="2"></rect><text x="622" y="179" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Live: fitted models</text><text x="622" y="198" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">tree walks and networks,</text><text x="622" y="212" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">exact against the fit</text></g><text x="12" y="20" fill="rgb(31, 35, 40)" font-size="11.5" text-anchor="start" data-figure-label="" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">offline</text><text x="312" y="20" fill="rgb(31, 35, 40)" font-size="11.5" text-anchor="start" data-figure-label="" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">committed</text><text x="612" y="20" fill="rgb(31, 35, 40)" font-size="11.5" text-anchor="start" data-figure-label="" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">browser</text><line x1="137" y1="96" x2="137" y2="106" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r1)"></line><line x1="262" y1="127.8" x2="310" y2="56" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r1)"></line><line x1="262" y1="141" x2="310" y2="127" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r1)"></line><line x1="262" y1="154.2" x2="310" y2="198" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r1)"></line><line x1="562" y1="56" x2="610" y2="56" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r1)"></line><line x1="562" y1="127" x2="610" y2="71.6" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r1)"></line><line x1="562" y1="198" x2="610" y2="191" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r1)"></line><g data-figure-notes=""><line x1="12" y1="242" x2="888" y2="242" stroke="rgb(208, 215, 222)" stroke-dasharray="3 4"></line><text x="12" y="258" fill="rgb(87, 96, 106)" font-size="11" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">The deploy copies the committed artifacts to static hosting and checks their digests; it never trains, never re-bakes and never recomputes</text><text x="12" y="273" fill="rgb(87, 96, 106)" font-size="11" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">a benchmark.</text></g></svg>
