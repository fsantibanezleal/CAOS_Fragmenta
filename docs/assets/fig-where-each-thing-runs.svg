<svg viewBox="0 0 900 288" role="img" aria-label="Where each thing runs" data-figure="" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="900" height="288" fill="#ffffff"/><defs><marker id="fr-arrow-r1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="rgb(87, 96, 106)"></path></marker></defs><g data-figure-box=""><rect x="12" y="30" width="250" height="66" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(9, 105, 218)" stroke-width="2"></rect><text x="22" y="51" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Engine package (PyPI)</text><text x="22" y="70" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">every model, the corpora,</text><text x="22" y="84" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">protocols, metrics, export</text></g><g data-figure-box=""><rect x="12" y="108" width="250" height="66" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(208, 215, 222)" stroke-width="1"></rect><text x="22" y="129" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Staged bake (this repo)</text><text x="22" y="148" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">ingest to validate,</text><text x="22" y="162" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">pinned versions, seed</text></g><g data-figure-box=""><rect x="312" y="30" width="250" height="52" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(208, 215, 222)" stroke-width="1"></rect><text x="322" y="51" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">16 case artifacts</text>