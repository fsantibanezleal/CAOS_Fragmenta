<svg viewBox="0 0 900 234" role="img" aria-label="From a published table to a scored prediction" data-figure="" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="900" height="234" fill="#ffffff"/><defs><marker id="fr-arrow-r1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="rgb(87, 96, 106)"></path></marker></defs><g data-figure-box=""><rect x="12" y="50" width="170" height="80" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(26, 127, 55)" stroke-width="2"></rect><text x="22" y="71" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">97 measured blasts</text><text x="22" y="90" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">10 campaigns, 5</text><text x="22" y="104" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">countries</text><text x="22" y="118" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">7 ratios + measured x50</text></g><g data-figure-box=""><rect x="210" y="50" width="170" height="80" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(208, 215, 222)" stroke-width="1"></rect><text x="220" y="71" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Geometry recovered</text><text x="220" y="90" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">B = (B/D)·D</text><text x="220" y="104" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">V = B·S·H</text><text x="220" y="118" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Q = Pf·V</text></g><g data-figure-box=""><rect x="430" y="18" width="200" height="66" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(9, 105, 218)" stroke-width="2"></rect><text x="440" y="39" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Ten predictors</text><text x="440" y="58" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">equations to ensembles</text><text x="440" y="72" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">+ null and oracle</text></g><g data-figure-box=""><rect x="430" y="102" width="200" height="66" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(154, 103, 0)" stroke-width="2"></rect><text x="440" y="123" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Three protocols</text><text x="440" y="142" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">random, deduplicated,</text><text x="440" y="156" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">one site held out</text></g><g data-figure-box=""><rect x="690" y="60" width="198" height="66" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(207, 34, 46)" stroke-width="2"></rect><text x="700" y="81" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Score with an interval</text><text x="700" y="100" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">variance explained</text><text x="700" y="114" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">site-resampled 95%</text></g><line x1="182" y1="90" x2="208" y2="90" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r1)"></line><line x1="380" y1="82" x2="428" y2="51" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r1)"></line><line x1="380" y1="98" x2="428" y2="135" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r1)"></line><line x1="630" y1="51" x2="688" y2="83.1" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r1)"></line><line x1="630" y1="135" x2="688" y2="102.9" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r1)"></line><g data-figure-notes=""><line x1="12" y1="188" x2="888" y2="188" stroke="rgb(208, 215, 222)" stroke-dasharray="3 4"></line><text x="12" y="204" fill="rgb(87, 96, 106)" font-size="11" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">The geometry step is what lets the classical equation run at all: the corpus prints ratios, and the hole diameters in the source prose turn</text><text x="12" y="219" fill="rgb(87, 96, 106)" font-size="11" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">them into metres for 91 of the 97 blasts.</text></g></svg>
