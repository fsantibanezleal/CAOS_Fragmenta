<svg viewBox="0 0 900 158" role="img" aria-label="The two data contracts" data-figure="" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="900" height="158" fill="#ffffff"/><defs><marker id="fr-arrow-r2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="rgb(87, 96, 106)"></path></marker></defs><g data-figure-box=""><rect x="12" y="14" width="260" height="80" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(154, 103, 0)" stroke-width="2"></rect><text x="22" y="35" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Contract 1, what gets in</text><text x="22" y="54" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">reject: not a blast</text><text x="22" y="68" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">flag: outside the envelope</text><text x="22" y="82" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">never clip a value</text></g><g data-figure-box=""><rect x="320" y="14" width="260" height="80" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(26, 127, 55)" stroke-width="2"></rect><text x="330" y="35" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Integrity gate</text><text x="330" y="54" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">the paper's own summary</text><text x="330" y="68" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">table, reproduced</text><text x="330" y="82" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">+ a pinned content digest</text></g><g data-figure-box=""><rect x="628" y="14" width="260" height="80" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(9, 105, 218)" stroke-width="2"></rect><text x="638" y="35" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Contract 2, what goes out</text><text x="638" y="54" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">content-addressed files</text><text x="638" y="68" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">typed mirror in the browser</text><text x="638" y="82" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">fails the build on drift</text></g><line x1="272" y1="54" x2="318" y2="54" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r2)"></line><line x1="580" y1="54" x2="626" y2="54" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r2)"></line><g data-figure-notes=""><line x1="12" y1="112" x2="888" y2="112" stroke="rgb(208, 215, 222)" stroke-dasharray="3 4"></line><text x="12" y="128" fill="rgb(87, 96, 106)" font-size="11" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">The gate exists because the corpus as first assembled disagreed with the published tables in five cells, two of them on the measured size;</text><text x="12" y="143" fill="rgb(87, 96, 106)" font-size="11" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">the tell was a powder-factor maximum of 1.47 against the 1.26 the paper prints in its own summary table.</text></g></svg>
