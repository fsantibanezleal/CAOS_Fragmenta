<svg viewBox="0 0 900 304" role="img" aria-label="The 2025 learners" data-figure="" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="900" height="304" fill="#ffffff"/><defs><marker id="fr-arrow-r6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="rgb(87, 96, 106)"></path></marker></defs><g data-figure-box=""><rect x="12" y="70" width="150" height="66" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(208, 215, 222)" stroke-width="1"></rect><text x="22" y="91" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Standard score</text><text x="22" y="110" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">(x - mean)/sd</text><text x="22" y="124" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">training rows</text></g><g data-figure-box=""><rect x="196" y="14" width="220" height="52" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(208, 215, 222)" stroke-width="1"></rect><text x="206" y="35" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Random forest</text><text x="206" y="54" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">76 trees, seed 27</text></g><g data-figure-box=""><rect x="196" y="80" width="220" height="80" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(154, 103, 0)" stroke-width="2"></rect><text x="206" y="101" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">XGBoost</text><text x="206" y="120" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">rate 0.5, seed 42</text><text x="206" y="134" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">fits its training rows almost</text><text x="206" y="148" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">exactly</text></g><g data-figure-box=""><rect x="196" y="174" width="220" height="66" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(208, 215, 222)" stroke-width="1"></rect><text x="206" y="195" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Support vectors</text><text x="206" y="214" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">radial: C 5.25, eps 0.04</text><text x="206" y="228" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">poly: degree 5, C 1</text></g><g data-figure-box=""><rect x="456" y="22" width="200" height="66" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(9, 105, 218)" stroke-width="2"></rect><text x="466" y="43" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Linear meta-learner</text><text x="466" y="62" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">fitted on IN-SAMPLE base</text><text x="466" y="76" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">predictions (no CV)</text></g><g data-figure-box=""><rect x="686" y="22" width="202" height="80" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(207, 34, 46)" stroke-width="2"></rect><text x="696" y="43" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Learned weights</text><text x="696" y="62" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">boosting 1.02</text><text x="696" y="76" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">forest -0.02</text><text x="696" y="90" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">= its boosting learner</text></g><line x1="162" y1="89.8" x2="194" y2="40" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r6)"></line><line x1="162" y1="103" x2="194" y2="120" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r6)"></line><line x1="162" y1="116.19999999999999" x2="194" y2="207" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r6)"></line><line x1="416" y1="40" x2="454" y2="45.099999999999994" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r6)"></line><line x1="416" y1="120" x2="454" y2="68.19999999999999" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r6)"></line><line x1="656" y1="55" x2="684" y2="55" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r6)"></line><g data-figure-notes=""><line x1="12" y1="258" x2="888" y2="258" stroke="rgb(208, 215, 222)" stroke-dasharray="3 4"></line><text x="12" y="274" fill="rgb(87, 96, 106)" font-size="11" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Trained on in-sample predictions, the meta-learner gives the boosting learner almost all the weight, because that learner reproduces its</text><text x="12" y="289" fill="rgb(87, 96, 106)" font-size="11" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">training rows almost exactly. The stacked model then behaves like its boosting learner under every protocol.</text></g></svg>
