<svg viewBox="0 0 900 204" role="img" aria-label="The protocol, and what it rules out" data-figure="" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="900" height="204" fill="#ffffff"/><defs><marker id="fr-arrow-r1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="rgb(87, 96, 106)"></path></marker></defs><text x="12" y="24" fill="rgb(207, 34, 46)" font-size="11.5" text-anchor="start" data-figure-label="" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">ruled out</text><text x="468" y="24" fill="rgb(26, 127, 55)" font-size="11.5" text-anchor="start" data-figure-label="" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">what is done</text><g data-figure-box=""><rect x="12" y="40" width="420" height="66" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(207, 34, 46)" stroke-width="2"></rect><text x="22" y="61" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Random rows to test</text><text x="22" y="80" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">a test row shares its campaign, rock,</text><text x="22" y="94" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">rig and measurement with training rows</text><line x1="16" y1="44" x2="428" y2="102" stroke="rgb(207, 34, 46)" stroke-width="2"></line><line x1="428" y1="44" x2="16" y2="102" stroke="rgb(207, 34, 46)" stroke-width="2"></line></g><g data-figure-box=""><rect x="12" y="118" width="420" height="66" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(207, 34, 46)" stroke-width="2"></rect><text x="22" y="139" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Tune on the test set, report it</text><text x="22" y="158" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">choosing a setting because the test score</text><text x="22" y="172" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">improved makes that score a training score</text><line x1="16" y1="122" x2="428" y2="180" stroke="rgb(207, 34, 46)" stroke-width="2"></line><line x1="428" y1="122" x2="16" y2="180" stroke="rgb(207, 34, 46)" stroke-width="2"></line></g><g data-figure-box=""><rect x="468" y="40" width="420" height="66" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(26, 127, 55)" stroke-width="2"></rect><text x="478" y="61" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Hold out a whole campaign</text><text x="478" y="80" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">every fitted quantity, including scaling and</text><text x="478" y="94" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">the rock-factor line, from the other nine sites</text></g><g data-figure-box=""><rect x="468" y="118" width="420" height="66" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(26, 127, 55)" stroke-width="2"></rect><text x="478" y="139" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Report the interval</text><text x="478" y="158" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">resample sites, not rows, and say when</text><text x="478" y="172" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">two arms cannot be told apart</text></g></svg>
