<svg viewBox="0 0 900 269" role="img" aria-label="The classical model, term by term" data-figure="" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="900" height="269" fill="#ffffff"/><defs><marker id="fr-arrow-r1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="rgb(87, 96, 106)"></path></marker></defs><g data-figure-box=""><rect x="12" y="14" width="190" height="80" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(208, 215, 222)" stroke-width="1"></rect><text x="22" y="35" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Absolute pattern</text><text x="22" y="54" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">B, S, H, T, D</text><text x="22" y="68" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">V = B·S·H</text><text x="22" y="82" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Q = Pf·V</text></g><g data-figure-box=""><rect x="12" y="110" width="190" height="80" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(154, 103, 0)" stroke-width="2"></rect><text x="22" y="131" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Rock factor A</text><text x="22" y="150" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">published ratings, or</text><text x="22" y="164" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">recovered per site, or</text><text x="22" y="178" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">predicted from E</text></g><g data-figure-box=""><rect x="245" y="69" width="220" height="66" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(9, 105, 218)" stroke-width="2"></rect><text x="255" y="90" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Mean size x50</text><text x="255" y="109" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">A·(V/Q)^0.8·Q^(1/6)</text><text x="255" y="123" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">·(RWS/115)^(-19/30)</text></g><g data-figure-box=""><rect x="505" y="14" width="200" height="66" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(207, 34, 46)" stroke-width="2"></rect><text x="515" y="35" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Uniformity n</text><text x="515" y="54" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">(2.2 - 14·B/d)·...</text><text x="515" y="68" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">B in m, d in mm</text></g><g data-figure-box=""><rect x="505" y="96" width="200" height="80" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(208, 215, 222)" stroke-width="1"></rect><text x="515" y="117" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Curve shape</text><text x="515" y="136" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Rosin-Rammler</text><text x="515" y="150" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Swebrec</text><text x="515" y="164" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">two-branch</text></g><g data-figure-box=""><rect x="745" y="62" width="143" height="66" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(26, 127, 55)" stroke-width="2"></rect><text x="755" y="83" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">P20, P50, P80</text><text x="755" y="102" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">oversize %</text><text x="755" y="116" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">fines %</text></g><line x1="202" y1="54" x2="243" y2="92.1" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r1)"></line><line x1="202" y1="150" x2="243" y2="111.9" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r1)"></line><line x1="465" y1="102" x2="503" y2="136" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r1)"></line><line x1="605" y1="80" x2="605" y2="94" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r1)"></line><line x1="705" y1="136" x2="743" y2="95" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r1)"></line><g data-figure-notes=""><line x1="12" y1="208" x2="888" y2="208" stroke="rgb(208, 215, 222)" stroke-dasharray="3 4"></line><text x="12" y="224" fill="rgb(87, 96, 106)" font-size="11" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">The trap in n: the source gives the burden in metres and the hole diameter in millimetres, so B/d is about 0.027 for a 4.5 m burden on a</text><text x="12" y="239" fill="rgb(87, 96, 106)" font-size="11" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">165 mm hole, a thousand times smaller than the ratio the corpus tabulates. Read as the tabulated ratio, the leading term becomes 2.2 minus</text><text x="12" y="254" fill="rgb(87, 96, 106)" font-size="11" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">382.</text></g></svg>
