<svg viewBox="0 0 900 194" role="img" aria-label="How a case withholds its own campaign" data-figure="" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="900" height="194" fill="#ffffff"/><defs><marker id="fr-arrow-r5" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="rgb(87, 96, 106)"></path></marker></defs><g data-figure-box=""><rect x="12" y="40" width="200" height="66" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(26, 127, 55)" stroke-width="2"></rect><text x="22" y="61" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Corpus minus the site</text><text x="22" y="80" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">e.g. 90 of 97 rows</text><text x="22" y="94" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">asserted at bake time</text></g><g data-figure-box=""><rect x="250" y="40" width="200" height="66" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(208, 215, 222)" stroke-width="1"></rect><text x="260" y="61" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Fit every fitted arm</text><text x="260" y="80" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">network, kernels, trees,</text><text x="260" y="94" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">refit, transfer line</text></g><g data-figure-box=""><rect x="490" y="14" width="190" height="52" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(9, 105, 218)" stroke-width="2"></rect><text x="500" y="35" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Case predictions</text><text x="500" y="54" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">the site never seen</text></g><g data-figure-box=""><rect x="490" y="78" width="190" height="52" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(154, 103, 0)" stroke-width="2"></rect><text x="500" y="99" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">Model file</text><text x="500" y="118" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">scope = that site</text></g><g data-figure-box=""><rect x="720" y="39" width="168" height="66" rx="6" fill="rgb(240, 243, 246)" stroke="rgb(208, 215, 222)" stroke-width="1"></rect><text x="730" y="60" fill="rgb(31, 35, 40)" font-size="12.5" font-weight="600" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">App, live</text><text x="730" y="79" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">same models as</text><text x="730" y="93" fill="rgb(87, 96, 106)" font-size="10.5" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">the replay</text></g><line x1="212" y1="73" x2="248" y2="73" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r5)"></line><line x1="450" y1="63.099999999999994" x2="488" y2="40" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r5)"></line><line x1="450" y1="82.9" x2="488" y2="104" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r5)"></line><line x1="680" y1="104" x2="718" y2="85.19999999999999" stroke="rgb(87, 96, 106)" stroke-width="1.4" marker-end="url(#fr-arrow-r5)"></line><line x1="680" y1="40" x2="718" y2="58.8" stroke="rgb(87, 96, 106)" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#fr-arrow-r5)"></line><g data-figure-notes=""><line x1="12" y1="148" x2="888" y2="148" stroke="rgb(208, 215, 222)" stroke-dasharray="3 4"></line><text x="12" y="164" fill="rgb(87, 96, 106)" font-size="11" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">The bake fails if any blast of the case appears in the rows its models were fitted on. A model fitted on a campaign and then shown</text><text x="12" y="179" fill="rgb(87, 96, 106)" font-size="11" font-family="Inter, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">predicting it would be recalling, not predicting.</text></g></svg>
