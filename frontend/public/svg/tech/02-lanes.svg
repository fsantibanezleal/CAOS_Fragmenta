<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" class="arch-svg" role="img" aria-label="The three lanes: offline canonical, replay, and the live browser engine">
  <style>
    .arch-svg text { font-family: var(--font-sans, Inter, "Segoe UI", system-ui, sans-serif); }
    .arch-svg .mono { font-family: var(--font-mono, ui-monospace, Consolas, monospace); }
    .arch-svg .bx { fill: var(--color-surface-2); stroke: var(--color-border); stroke-width: 1.2; }
    .arch-svg .bx-hi { stroke: var(--color-accent); stroke-width: 1.8; }
    .arch-svg .bx-good { stroke: var(--color-good); stroke-width: 1.8; }
    .arch-svg .bx-warn { stroke: var(--color-warn); stroke-width: 1.8; }
    .arch-svg .bx-bad { stroke: var(--color-bad); stroke-width: 1.8; }
    .arch-svg .lane { fill: none; stroke: var(--color-border); stroke-width: 1; stroke-dasharray: 5 4; }
    .arch-svg .ttl { fill: var(--color-fg); font-size: 14px; font-weight: 700; }
    .arch-svg .hd { fill: var(--color-fg); font-size: 12px; font-weight: 650; }
    .arch-svg .it { fill: var(--color-fg); font-size: 11px; }
    .arch-svg .cd { fill: var(--color-accent); font-size: 9.5px; }
    .arch-svg .mu { fill: var(--color-fg-subtle); font-size: 10px; }
    .arch-svg .bad { fill: var(--color-bad); font-size: 10.5px; font-weight: 600; }
    .arch-svg .flow { fill: none; stroke: var(--color-fg-faint); stroke-width: 1.6; }
  </style>
  <defs>
    <marker id="fa2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--color-fg-faint)"/>
    </marker>
  </defs>

  <text class="ttl" x="22" y="26"><tspan class="l-en">Three lanes, and what runs in each</tspan><tspan class="l-es" x="22">Tres carriles, y que corre en cada uno</tspan></text>

  <rect class="lane" x="14" y="40" width="872" height="128" rx="8"/>
  <text class="hd" x="26" y="60"><tspan class="l-en">OFFLINE, canonical</tspan><tspan class="l-es" x="26">SIN CONEXION, canonico</tspan></text>
  <text class="mu" x="150" y="60"><tspan class="l-en">pinned Python, runs before release, never at deploy</tspan><tspan class="l-es" x="150">Python fijado, corre antes de publicar, nunca al desplegar</tspan></text>

  <rect class="bx bx-good" x="26" y="72" width="152" height="82" rx="9"/>
  <text class="hd" x="38" y="92">ingest</text>
  <text class="mono cd" x="38" y="110">contract 1</text>
  <text class="mono cd" x="38" y="124">integrity gate</text>
  <text class="mu" x="38" y="144"><tspan class="l-en">rejects, never clips</tspan><tspan class="l-es" x="38">rechaza, nunca recorta</tspan></text>

  <path class="flow" d="M182,113 L206,113" marker-end="url(#fa2)"/>
  <rect class="bx" x="210" y="72" width="152" height="82" rx="9"/>
  <text class="hd" x="222" y="92">preprocess</text>
  <text class="mono cd" x="222" y="110">B = (B/D) x D</text>
  <text class="mono cd" x="222" y="124">Q = Pf x B x S x H</text>
  <text class="mu" x="222" y="144"><tspan class="l-en">15 constraints asserted</tspan><tspan class="l-es" x="222">15 restricciones verificadas</tspan></text>

  <path class="flow" d="M366,113 L390,113" marker-end="url(#fa2)"/>
  <rect class="bx" x="394" y="72" width="152" height="82" rx="9"/>
  <text class="hd" x="406" y="92">train</text>
  <text class="mono cd" x="406" y="110">site withheld</text>
  <text class="mono cd" x="406" y="124">seed drawn first</text>
  <text class="mu" x="406" y="144"><tspan class="l-en">leakage is asserted</tspan><tspan class="l-es" x="406">la fuga se comprueba</tspan></text>

  <path class="flow" d="M550,113 L574,113" marker-end="url(#fa2)"/>
  <rect class="bx" x="578" y="72" width="152" height="82" rx="9"/>
  <text class="hd" x="590" y="92">evaluate</text>
  <text class="mono cd" x="590" y="110">both statistics</text>
  <text class="mono cd" x="590" y="124">null beside each</text>
  <text class="mu" x="590" y="144"><tspan class="l-en">abstentions counted</tspan><tspan class="l-es" x="590">abstenciones contadas</tspan></text>

  <path class="flow" d="M734,113 L758,113" marker-end="url(#fa2)"/>
  <rect class="bx bx-good" x="762" y="72" width="112" height="82" rx="9"/>
  <text class="hd" x="774" y="92">export</text>
  <text class="mono cd" x="774" y="110">sha256 per</text>
  <text class="mono cd" x="774" y="124">case file</text>
  <text class="mu" x="774" y="144">1.2 MB total</text>

  <path class="flow" d="M818,158 L818,196" marker-end="url(#fa2)"/>

  <rect class="lane" x="14" y="200" width="872" height="112" rx="8"/>
  <text class="hd" x="26" y="220"><tspan class="l-en">REPLAY, the default evidence</tspan><tspan class="l-es" x="26">REPRODUCCION, la evidencia por defecto</tspan></text>
  <text class="mu" x="238" y="220"><tspan class="l-en">committed, content-addressed, re-hashed by the release gate</tspan><tspan class="l-es" x="238">comprometidos, direccionados por contenido, re-verificados</tspan></text>

  <rect class="bx bx-hi" x="26" y="232" width="200" height="66" rx="9"/>
  <text class="mono cd" x="38" y="254">data/derived/&lt;case&gt;/case.json</text>
  <text class="mu" x="38" y="274">16 cases, 31 to 101 kB each</text>
  <text class="mu" x="38" y="290">1824 prediction cells</text>

  <rect class="bx bx-hi" x="238" y="232" width="200" height="66" rx="9"/>
  <text class="mono cd" x="250" y="254">data/derived/benchmark.json</text>
  <text class="mu" x="250" y="274">the protocol sweep, the seed</text>
  <text class="mu" x="250" y="290">sweep, both reproductions</text>

  <rect class="bx" x="450" y="232" width="200" height="66" rx="9"/>
  <text class="mono cd" x="462" y="254">manifests/index.json</text>
  <text class="mu" x="462" y="274">what the web reads first;</text>
  <text class="mu" x="462" y="290">declared vs shipped is checked</text>

  <rect class="bx bx-bad" x="662" y="232" width="212" height="66" rx="9"/>
  <text class="hd" x="674" y="252"><tspan class="l-en">Deploy never trains</tspan><tspan class="l-es" x="674">El despliegue no entrena</tspan></text>
  <text class="mu" x="674" y="272"><tspan class="l-en">it copies audited artifacts and</tspan><tspan class="l-es" x="674">copia artefactos auditados y</tspan></text>
  <text class="mu" x="674" y="288"><tspan class="l-en">verifies hashes. Nothing else.</tspan><tspan class="l-es" x="674">verifica resumenes. Nada mas.</tspan></text>

  <path class="flow" d="M126,302 L126,342" marker-end="url(#fa2)"/>

  <rect class="lane" x="14" y="346" width="872" height="110" rx="8"/>
  <text class="hd" x="26" y="366"><tspan class="l-en">LIVE, in the browser</tspan><tspan class="l-es" x="26">VIVO, en el navegador</tspan></text>
  <text class="mu" x="176" y="366"><tspan class="l-en">so that changing a burden moves the curve, not a page reload</tspan><tspan class="l-es" x="176">para que cambiar un bordo mueva la curva, sin recargar</tspan></text>

  <rect class="bx bx-warn" x="26" y="378" width="230" height="66" rx="9"/>
  <text class="mono cd" x="38" y="400">frontend/src/engine/live.ts</text>
  <text class="mu" x="38" y="420"><tspan class="l-en">the closed forms, reimplemented</tspan><tspan class="l-es" x="38">las formas cerradas, reimplementadas</tspan></text>
  <text class="mu" x="38" y="436"><tspan class="l-en">in TypeScript from the same sources</tspan><tspan class="l-es" x="38">en TypeScript desde las mismas fuentes</tspan></text>

  <path class="flow" d="M260,411 L292,411" marker-end="url(#fa2)"/>

  <rect class="bx bx-bad" x="296" y="378" width="272" height="66" rx="9"/>
  <text class="hd" x="308" y="398"><tspan class="l-en">Parity is a GATE</tspan><tspan class="l-es" x="308">La paridad es una COMPUERTA</tspan></text>
  <text class="mu" x="308" y="418"><tspan class="l-en">the TypeScript result is scored against the</tspan><tspan class="l-es" x="308">el resultado en TypeScript se compara con los</tspan></text>
  <text class="mu" x="308" y="434"><tspan class="l-en">baked numbers; a divergence fails the build</tspan><tspan class="l-es" x="308">numeros horneados; una divergencia falla la compilacion</tspan></text>

  <path class="flow" d="M572,411 L604,411" marker-end="url(#fa2)"/>

  <rect class="bx" x="608" y="378" width="266" height="66" rx="9"/>
  <text class="mu" x="620" y="398"><tspan class="l-en">Two implementations of one equation drift the</tspan><tspan class="l-es" x="620">Dos implementaciones de una ecuacion se separan</tspan></text>
  <text class="mu" x="620" y="414"><tspan class="l-en">moment nobody checks, and the symptom is a</tspan><tspan class="l-es" x="620">en cuanto nadie revisa, y el sintoma es un grafico</tspan></text>
  <text class="mu" x="620" y="430"><tspan class="l-en">chart that is subtly wrong and fully plausible.</tspan><tspan class="l-es" x="620">sutilmente erroneo y del todo verosimil.</tspan></text>
</svg>
