<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" class="arch-svg" role="img" aria-label="The web flow: routes, the workbench tabs, and the focus view">
  <style>
    .arch-svg text { font-family: var(--font-sans, Inter, "Segoe UI", system-ui, sans-serif); }
    .arch-svg .mono { font-family: var(--font-mono, ui-monospace, Consolas, monospace); }
    .arch-svg .bx { fill: var(--color-surface-2); stroke: var(--color-border); stroke-width: 1.2; }
    .arch-svg .bx-hi { stroke: var(--color-accent); stroke-width: 1.8; }
    .arch-svg .bx-good { stroke: var(--color-good); stroke-width: 1.8; }
    .arch-svg .bx-bad { stroke: var(--color-bad); stroke-width: 1.8; }
    .arch-svg .ttl { fill: var(--color-fg); font-size: 14px; font-weight: 700; }
    .arch-svg .hd { fill: var(--color-fg); font-size: 12px; font-weight: 650; }
    .arch-svg .cd { fill: var(--color-accent); font-size: 9.5px; }
    .arch-svg .mu { fill: var(--color-fg-subtle); font-size: 10px; }
    .arch-svg .flow { fill: none; stroke: var(--color-fg-faint); stroke-width: 1.6; }
  </style>
  <defs>
    <marker id="fa3" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--color-fg-faint)"/>
    </marker>
  </defs>

  <text class="ttl" x="22" y="26"><tspan class="l-en">Six routes, and one that escapes the chrome</tspan><tspan class="l-es" x="22">Seis rutas, y una que escapa del marco</tspan></text>

  <rect class="bx bx-hi" x="20" y="44" width="180" height="150" rx="10"/>
  <text class="hd" x="32" y="66"><tspan class="l-en">App, the workbench</tspan><tspan class="l-es" x="32">App, el taller</tspan></text>
  <text class="mono cd" x="32" y="86">/?case=&lt;id&gt;</text>
  <text class="mu" x="32" y="106"><tspan class="l-en">ONE selected case</tspan><tspan class="l-es" x="32">UN caso seleccionado</tspan></text>
  <text class="mu" x="32" y="122"><tspan class="l-en">a 320px rail plus</tspan><tspan class="l-es" x="32">una barra de 320px mas</tspan></text>
  <text class="mu" x="32" y="138"><tspan class="l-en">six sibling tabs</tspan><tspan class="l-es" x="32">seis pestanas hermanas</tspan></text>
  <text class="mu" x="32" y="162"><tspan class="l-en">Anything that summarises</tspan><tspan class="l-es" x="32">Todo lo que resume entre</tspan></text>
  <text class="mu" x="32" y="176"><tspan class="l-en">ACROSS cases is elsewhere.</tspan><tspan class="l-es" x="32">CASOS vive en otra parte.</tspan></text>

  <path class="flow" d="M204,119 L236,119" marker-end="url(#fa3)"/>

  <rect class="bx" x="240" y="44" width="120" height="24" rx="6"/><text class="mono cd" x="250" y="60">Predict</text>
  <rect class="bx" x="240" y="72" width="120" height="24" rx="6"/><text class="mono cd" x="250" y="88">Distribution</text>
  <rect class="bx" x="240" y="100" width="120" height="24" rx="6"/><text class="mono cd" x="250" y="116">Bench</text>
  <rect class="bx" x="240" y="128" width="120" height="24" rx="6"/><text class="mono cd" x="250" y="144">Rock</text>
  <rect class="bx" x="240" y="156" width="120" height="24" rx="6"/><text class="mono cd" x="250" y="172">Explain</text>
  <rect class="bx" x="240" y="184" width="120" height="24" rx="6"/><text class="mono cd" x="250" y="200">Decide</text>

  <text class="mu" x="240" y="228"><tspan class="l-en">grouped by the QUESTION, not by</tspan><tspan class="l-es" x="240">agrupadas por la PREGUNTA, no por</tspan></text>
  <text class="mu" x="240" y="242"><tspan class="l-en">the model list. Thirteen models as</tspan><tspan class="l-es" x="240">la lista de modelos. Trece modelos</tspan></text>
  <text class="mu" x="240" y="256"><tspan class="l-en">thirteen tabs is a list, not an</tspan><tspan class="l-es" x="240">como trece pestanas son una lista,</tspan></text>
  <text class="mu" x="240" y="270"><tspan class="l-en">architecture.</tspan><tspan class="l-es" x="240">no una arquitectura.</tspan></text>

  <path class="flow" d="M364,119 L396,119" marker-end="url(#fa3)"/>

  <rect class="bx bx-good" x="400" y="80" width="180" height="78" rx="10"/>
  <text class="hd" x="412" y="102"><tspan class="l-en">Model selector</tspan><tspan class="l-es" x="412">Selector de modelo</tspan></text>
  <text class="mono cd" x="412" y="122">select with optgroup</text>
  <text class="mu" x="412" y="140"><tspan class="l-en">a categorised one-of-N is a</tspan><tspan class="l-es" x="412">un uno-de-N categorizado es</tspan></text>
  <text class="mu" x="412" y="152"><tspan class="l-en">select, not thirteen buttons</tspan><tspan class="l-es" x="412">un select, no trece botones</tspan></text>

  <rect class="bx" x="600" y="44" width="140" height="22" rx="6"/><text class="mono cd" x="610" y="59">/introduction</text>
  <rect class="bx" x="600" y="70" width="140" height="22" rx="6"/><text class="mono cd" x="610" y="85">/methodology</text>
  <rect class="bx" x="600" y="96" width="140" height="22" rx="6"/><text class="mono cd" x="610" y="111">/implementation</text>
  <rect class="bx" x="600" y="122" width="140" height="22" rx="6"/><text class="mono cd" x="610" y="137">/experiments</text>
  <rect class="bx" x="600" y="148" width="140" height="22" rx="6"/><text class="mono cd" x="610" y="163">/benchmark</text>
  <text class="mu" x="600" y="190"><tspan class="l-en">cross-case evidence lives</tspan><tspan class="l-es" x="600">la evidencia entre casos vive</tspan></text>
  <text class="mu" x="600" y="204"><tspan class="l-en">on the last two only</tspan><tspan class="l-es" x="600">solo en las dos ultimas</tspan></text>

  <rect class="bx bx-bad" x="760" y="80" width="124" height="90" rx="10"/>
  <text class="hd" x="772" y="102"><tspan class="l-en">Focus</tspan><tspan class="l-es" x="772">Pantalla completa</tspan></text>
  <text class="mono cd" x="772" y="122">/focus/&lt;case&gt;</text>
  <text class="mu" x="772" y="142"><tspan class="l-en">renders OUTSIDE</tspan><tspan class="l-es" x="772">se dibuja FUERA</tspan></text>
  <text class="mu" x="772" y="156"><tspan class="l-en">the shell</tspan><tspan class="l-es" x="772">del armazon</tspan></text>

  <line x1="20" y1="290" x2="880" y2="290" stroke="var(--color-border)" stroke-width="1"/>

  <text class="ttl" x="22" y="318"><tspan class="l-en">Two things that were easy to get wrong</tspan><tspan class="l-es" x="22">Dos cosas faciles de equivocar</tspan></text>

  <rect class="bx bx-bad" x="20" y="332" width="420" height="106" rx="10"/>
  <text class="hd" x="32" y="354"><tspan class="l-en">A cold deep link into the focus route</tspan><tspan class="l-es" x="32">Un enlace directo en frio a pantalla completa</tspan></text>
  <text class="mu" x="32" y="376"><tspan class="l-en">The header and footer are exactly the chrome a full-screen</tspan><tspan class="l-es" x="32">El encabezado y el pie son justamente el marco del que una</tspan></text>
  <text class="mu" x="32" y="390"><tspan class="l-en">view exists to escape, so it cannot be a child of the shell.</tspan><tspan class="l-es" x="32">vista completa escapa, asi que no puede colgar del armazon.</tspan></text>
  <text class="mu" x="32" y="410"><tspan class="l-en">It therefore applies the theme ITSELF. Without that, a link</tspan><tspan class="l-es" x="32">Por eso aplica el tema POR SI MISMA. Sin eso, un enlace</tspan></text>
  <text class="mu" x="32" y="424"><tspan class="l-en">opened directly boots in the wrong palette every time.</tspan><tspan class="l-es" x="32">abierto directo arranca siempre con la paleta equivocada.</tspan></text>

  <rect class="bx bx-bad" x="456" y="332" width="428" height="106" rx="10"/>
  <text class="hd" x="468" y="354"><tspan class="l-en">A 200 response, not just a rendered page</tspan><tspan class="l-es" x="468">Una respuesta 200, no solo una pagina dibujada</tspan></text>
  <text class="mu" x="468" y="376"><tspan class="l-en">A static host serves a fallback page for an unknown path, so</tspan><tspan class="l-es" x="468">Un host estatico sirve una pagina de reserva para una ruta</tspan></text>
  <text class="mu" x="468" y="390"><tspan class="l-en">the app appears and the status is still 404. A shared link is</tspan><tspan class="l-es" x="468">desconocida: la app aparece y el estado sigue siendo 404. Un</tspan></text>
  <text class="mu" x="468" y="410"><tspan class="l-en">then a 404 to every crawler. The build writes a real file at</tspan><tspan class="l-es" x="468">enlace compartido es un 404 para todo rastreador. La</tspan></text>
  <text class="mu" x="468" y="424"><tspan class="l-en">each route path so the server answers 200.</tspan><tspan class="l-es" x="468">compilacion escribe un archivo real por ruta para responder 200.</tspan></text>
</svg>
