<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A block broken into four shards, which is what the product predicts the size of. -->
  <rect width="32" height="32" rx="7" fill="#2563eb"/>
  <g fill="#ffffff">
    <polygon points="7,8 15,7 14,15 6,16"/>
    <polygon points="17,7 25,9 24,14 16,15"/>
    <polygon points="6,18 13,17 12,25 7,24"/>
    <polygon points="15,17 25,16 26,23 18,25"/>
  </g>
</svg>
