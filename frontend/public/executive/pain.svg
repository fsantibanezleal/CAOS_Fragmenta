<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="A mine bench with coarse boulders and fines, trucks queueing at the crusher and a grinding mill drawing heavy power for low output, while the blast and the plant budgets stay apart">
<title>The pain: the blast sets the rock size, the plant pays for it</title>
<style>
/* An animated scene (shell 0.14.0): the trucks queue at the crusher one by one, the mill power rises and the output falls.
   The labels never move. One 9 s loop; the drawing below without animation is the final frame, which prefers-reduced-motion shows. */
.frp-a { animation-duration: 9s; animation-iteration-count: infinite; animation-timing-function: ease-out; }
.frp-q1 { animation-name: frp-q1; }
.frp-q2 { animation-name: frp-q2; }
.frp-q3 { animation-name: frp-q3; }
.frp-up { animation-name: frp-up; transform-origin: 0 0; animation-timing-function: ease-in-out; }
.frp-down { animation-name: frp-down; transform-origin: 0 0; animation-timing-function: ease-in-out; }
@keyframes frp-q1 { 0%, 4% { opacity: 0; transform: translateX(-36px); } 14%, 100% { opacity: 1; transform: none; } }
@keyframes frp-q2 { 0%, 22% { opacity: 0; transform: translateX(-36px); } 32%, 100% { opacity: 1; transform: none; } }
@keyframes frp-q3 { 0%, 40% { opacity: 0; transform: translateX(-36px); } 50%, 100% { opacity: 1; transform: none; } }
@keyframes frp-up { 0%, 50% { transform: rotate(-120deg); } 80%, 100% { transform: none; } }
@keyframes frp-down { 0%, 50% { transform: rotate(120deg); } 80%, 100% { transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .frp-a { animation: none; opacity: 1; transform: none; }
}
</style>
