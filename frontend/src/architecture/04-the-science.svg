<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 456" width="900" class="arch-svg" role="img" aria-label="The science flow">
  <style>
    .arch-svg text { font-family: var(--font-sans, Inter, "Segoe UI", system-ui, sans-serif); }
    .arch-svg .bx { fill: var(--color-surface-2); stroke: var(--color-border); stroke-width: 1.2; }
    .arch-svg .bx-accent { stroke: var(--color-accent); stroke-width: 1.8; }
    .arch-svg .bx-good { stroke: var(--color-good); stroke-width: 1.8; }
    .arch-svg .bx-bad { stroke: var(--color-bad); stroke-width: 1.8; }
    .arch-svg .bx-warn { stroke: var(--color-warn); stroke-width: 1.8; }
    .arch-svg .ttl { fill: var(--color-fg); font-size: 14px; font-weight: 700; }
    .arch-svg .hd { fill: var(--color-fg); font-size: 12.5px; font-weight: 600; }
    .arch-svg .mu { fill: var(--color-fg-subtle); font-size: 10.5px; }
    .arch-svg .nt { fill: var(--color-fg-subtle); font-size: 11px; }
    .arch-svg .band { stroke: var(--color-border); stroke-dasharray: 3 4; }
    .arch-svg .flow { fill: none; stroke: var(--color-fg-faint); stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arch-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--color-fg-faint)"/>
    </marker>
  </defs>
<g class="l-en">
<text class="ttl" x="22" y="28">The obstacle, and how it was closed</text>
<rect class="bx bx-bad" x="22.0" y="64.0" width="270.0" height="80.0" rx="6"/>
<text class="hd" x="32.0" y="85.0">A dimensionless corpus</text>
<text class="mu" x="32.0" y="104.0">seven ratios and no dimensions; the</text>
<text class="mu" x="32.0" y="118.0">classical equation needs volume and</text>
<text class="mu" x="32.0" y="132.0">charge per hole</text>
<rect class="bx" x="22.0" y="154.0" width="270.0" height="80.0" rx="6"/>
<text class="hd" x="32.0" y="175.0">The prose closes it</text>
<text class="mu" x="32.0" y="194.0">B = (B/D)·D, V = B·S·H, Q = Pf·V</text>
<text class="mu" x="32.0" y="208.0">a diameter for 8 of 10 sites, a 9th from</text>
<text class="mu" x="32.0" y="222.0">its bench height</text>
<rect class="bx bx-good" x="22.0" y="244.0" width="270.0" height="66.0" rx="6"/>
<text class="hd" x="32.0" y="265.0">Checked: 15 of 15</text>
<text class="mu" x="32.0" y="284.0">dimensional constraints the same prose</text>
<text class="mu" x="32.0" y="298.0">states, at nine sites</text>
<rect class="bx bx-accent" x="312.0" y="64.0" width="270.0" height="80.0" rx="6"/>
<text class="hd" x="322.0" y="85.0">A rock factor nobody printed</text>
<text class="mu" x="322.0" y="104.0">recovered by inverting the equation on</text>
<text class="mu" x="322.0" y="118.0">the published predictions; within-site</text>
<text class="mu" x="322.0" y="132.0">spread 0.6 to 3.7 percent</text>
<rect class="bx bx-good" x="312.0" y="154.0" width="270.0" height="94.0" rx="6"/>
<text class="hd" x="322.0" y="175.0">A transfer line</text>
<text class="mu" x="322.0" y="194.0">the factor predicted from Young&#x27;s</text>
<text class="mu" x="322.0" y="208.0">modulus over training sites only: 0.298</text>
<text class="mu" x="322.0" y="222.0">held out by site, against 0.311 with the</text>
<text class="mu" x="322.0" y="236.0">site&#x27;s own factor</text>
<rect class="bx" x="602.0" y="64.0" width="276.0" height="66.0" rx="6"/>
<text class="hd" x="612.0" y="85.0">Classical</text>
<text class="mu" x="612.0" y="104.0">the mean size two ways, and three curve</text>
<text class="mu" x="612.0" y="118.0">shapes that share it</text>
<rect class="bx" x="602.0" y="140.0" width="276.0" height="80.0" rx="6"/>
<text class="hd" x="612.0" y="161.0">Statistical</text>
<text class="mu" x="612.0" y="180.0">the router and the published regression,</text>
<text class="mu" x="612.0" y="194.0">both fitted by their source on the</text>
<text class="mu" x="612.0" y="208.0">corpus; the refit</text>
<rect class="bx" x="602.0" y="230.0" width="276.0" height="66.0" rx="6"/>
<text class="hd" x="612.0" y="251.0">Learned, 6</text>
<text class="mu" x="612.0" y="270.0">network, two kernels, forest, boosting,</text>
<text class="mu" x="612.0" y="284.0">stacking</text>
<rect class="bx" x="602.0" y="306.0" width="276.0" height="66.0" rx="6"/>
<text class="hd" x="612.0" y="327.0">Controls, 2</text>
<text class="mu" x="612.0" y="346.0">the null predicts the training mean; the</text>
<text class="mu" x="612.0" y="360.0">oracle returns the measurement</text>
<line class="flow" x1="157.0" y1="144.0" x2="157.0" y2="152.0" marker-end="url(#arch-arrow)"/>
<line class="flow" x1="157.0" y1="234.0" x2="157.0" y2="242.0" marker-end="url(#arch-arrow)"/>
<line class="flow" x1="292.0" y1="194.0" x2="310.0" y2="104.0" marker-end="url(#arch-arrow)"/>
<line class="flow" x1="447.0" y1="144.0" x2="447.0" y2="152.0" marker-end="url(#arch-arrow)"/>
<line class="flow" x1="582.0" y1="201.0" x2="600.0" y2="97.0" marker-end="url(#arch-arrow)"/>
<line class="band" x1="22" y1="384.0" x2="878" y2="384.0"/>
<text class="nt" x="22" y="402.0">The tenth site, Miami, publishes nothing absolute, so its six blasts are not reconstructed and every arm that needs a volume abstains</text>
<text class="nt" x="22" y="417.0">there with a reason; those six blasts are also what the verdict turns on.</text>
</g>
<g class="l-es">
<text class="ttl" x="22" y="28">El obstáculo, y cómo se cerró</text>
<rect class="bx bx-bad" x="22.0" y="64.0" width="270.0" height="80.0" rx="6"/>
<text class="hd" x="32.0" y="85.0">Un corpus adimensional</text>
<text class="mu" x="32.0" y="104.0">siete razones y ninguna dimensión; la</text>
<text class="mu" x="32.0" y="118.0">ecuación clásica necesita volumen y</text>
<text class="mu" x="32.0" y="132.0">carga por barreno</text>
<rect class="bx" x="22.0" y="154.0" width="270.0" height="80.0" rx="6"/>
<text class="hd" x="32.0" y="175.0">La prosa lo cierra</text>
<text class="mu" x="32.0" y="194.0">B = (B/D)·D, V = B·S·H, Q = Pf·V</text>
<text class="mu" x="32.0" y="208.0">un diámetro en 8 de 10 sitios, un noveno</text>
<text class="mu" x="32.0" y="222.0">desde su altura de banco</text>
<rect class="bx bx-good" x="22.0" y="244.0" width="270.0" height="66.0" rx="6"/>
<text class="hd" x="32.0" y="265.0">Comprobado: 15 de 15</text>
<text class="mu" x="32.0" y="284.0">restricciones dimensionales que declara</text>
<text class="mu" x="32.0" y="298.0">la misma prosa, en nueve sitios</text>
<rect class="bx bx-accent" x="312.0" y="64.0" width="270.0" height="96.0" rx="6"/>
<text class="hd" x="322.0" y="85.0">Un factor de roca que nadie</text>
<text class="hd" x="322.0" y="101.0">imprimió</text>
<text class="mu" x="322.0" y="120.0">recuperado invirtiendo la ecuación sobre</text>
<text class="mu" x="322.0" y="134.0">las predicciones publicadas; dispersión</text>
<text class="mu" x="322.0" y="148.0">dentro del sitio 0.6 a 3.7 por ciento</text>
<rect class="bx bx-good" x="312.0" y="170.0" width="270.0" height="94.0" rx="6"/>
<text class="hd" x="322.0" y="191.0">Una recta de transferencia</text>
<text class="mu" x="322.0" y="210.0">el factor predicho desde el módulo solo</text>
<text class="mu" x="322.0" y="224.0">con los sitios de entrenamiento: 0.298</text>
<text class="mu" x="322.0" y="238.0">con el sitio excluido, frente a 0.311</text>
<text class="mu" x="322.0" y="252.0">con el factor propio</text>
<rect class="bx" x="602.0" y="64.0" width="276.0" height="66.0" rx="6"/>
<text class="hd" x="612.0" y="85.0">Clásicos</text>
<text class="mu" x="612.0" y="104.0">el tamaño medio de dos formas, y tres</text>
<text class="mu" x="612.0" y="118.0">formas de curva que lo comparten</text>
<rect class="bx" x="602.0" y="140.0" width="276.0" height="80.0" rx="6"/>
<text class="hd" x="612.0" y="161.0">Estadísticos</text>
<text class="mu" x="612.0" y="180.0">el enrutador y la regresión publicada,</text>
<text class="mu" x="612.0" y="194.0">ambos ajustados por su fuente sobre el</text>
<text class="mu" x="612.0" y="208.0">corpus; el reajuste</text>
<rect class="bx" x="602.0" y="230.0" width="276.0" height="66.0" rx="6"/>
<text class="hd" x="612.0" y="251.0">Aprendidos, 6</text>
<text class="mu" x="612.0" y="270.0">red, dos núcleos, bosque, potenciación,</text>
<text class="mu" x="612.0" y="284.0">apilado</text>
<rect class="bx" x="602.0" y="306.0" width="276.0" height="80.0" rx="6"/>
<text class="hd" x="612.0" y="327.0">Controles, 2</text>
<text class="mu" x="612.0" y="346.0">el nulo predice la media de</text>
<text class="mu" x="612.0" y="360.0">entrenamiento; el oráculo devuelve la</text>
<text class="mu" x="612.0" y="374.0">medición</text>
<line class="flow" x1="157.0" y1="144.0" x2="157.0" y2="152.0" marker-end="url(#arch-arrow)"/>
<line class="flow" x1="157.0" y1="234.0" x2="157.0" y2="242.0" marker-end="url(#arch-arrow)"/>
<line class="flow" x1="292.0" y1="194.0" x2="310.0" y2="112.0" marker-end="url(#arch-arrow)"/>
<line class="flow" x1="447.0" y1="160.0" x2="447.0" y2="168.0" marker-end="url(#arch-arrow)"/>
<line class="flow" x1="582.0" y1="217.0" x2="600.0" y2="97.0" marker-end="url(#arch-arrow)"/>
<line class="band" x1="22" y1="398.0" x2="878" y2="398.0"/>
<text class="nt" x="22" y="416.0">El décimo sitio, Miami, no publica nada absoluto, así que sus seis tiros no se reconstruyen y todo brazo que necesita volumen se</text>
<text class="nt" x="22" y="431.0">abstiene allí con una razón; esos seis tiros son también de los que depende el veredicto.</text>
</g>
</svg>
