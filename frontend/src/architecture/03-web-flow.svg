<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 428" width="900" class="arch-svg" role="img" aria-label="The web flow">
  <style>
    .arch-svg text { font-family: var(--font-sans, Inter, "Segoe UI", system-ui, sans-serif); }
    .arch-svg .bx { fill: var(--color-surface-2); stroke: var(--color-border); stroke-width: 1.2; }
    .arch-svg .bx-accent { stroke: var(--color-accent); stroke-width: 1.8; }
    .arch-svg .bx-good { stroke: var(--color-good); stroke-width: 1.8; }
    .arch-svg .bx-bad { stroke: var(--color-bad); stroke-width: 1.8; }
    .arch-svg .bx-warn { stroke: var(--color-warn); stroke-width: 1.8; }
    .arch-svg .ttl { fill: var(--color-fg); font-size: 14px; font-weight: 700; }
    .arch-svg .hd { fill: var(--color-fg); font-size: 12.5px; font-weight: 600; }
    .arch-svg .mu { fill: var(--color-fg-subtle); font-size: 10.5px; }
    .arch-svg .nt { fill: var(--color-fg-subtle); font-size: 11px; }
    .arch-svg .band { stroke: var(--color-border); stroke-dasharray: 3 4; }
    .arch-svg .flow { fill: none; stroke: var(--color-fg-faint); stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arch-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="var(--color-fg-faint)"/>
    </marker>
  </defs>
<g class="l-en">
<text class="ttl" x="22" y="28">Six routes and one view outside the chrome</text>
<rect class="bx bx-accent" x="22.0" y="64.0" width="300.0" height="66.0" rx="6"/>
<text class="hd" x="32.0" y="85.0">App: the shell&#x27;s case workbench</text>
<text class="mu" x="32.0" y="104.0">the case, its variants, the model and the</text>
<text class="mu" x="32.0" y="118.0">open group&#x27;s controls in the rail</text>
<rect class="bx" x="22.0" y="140.0" width="300.0" height="66.0" rx="6"/>
<text class="hd" x="32.0" y="161.0">Six slots, by question</text>
<text class="mu" x="32.0" y="180.0">Predict, Distribution, Design, Rock, Compare</text>
<text class="mu" x="32.0" y="194.0">the variants, The case</text>
<rect class="bx bx-good" x="22.0" y="216.0" width="300.0" height="80.0" rx="6"/>
<text class="hd" x="32.0" y="237.0">Design</text>
<text class="mu" x="32.0" y="256.0">the response surface over burden and spacing</text>
<text class="mu" x="32.0" y="270.0">and every model on the design, live from the</text>
<text class="mu" x="32.0" y="284.0">case&#x27;s own fitted models</text>
<rect class="bx" x="352.0" y="64.0" width="260.0" height="66.0" rx="6"/>
<text class="hd" x="362.0" y="85.0">Introduction</text>
<text class="mu" x="362.0" y="104.0">why fragmentation matters, the</text>
<text class="mu" x="362.0" y="118.0">relations, the question, the scope</text>
<rect class="bx" x="352.0" y="140.0" width="260.0" height="66.0" rx="6"/>
<text class="hd" x="362.0" y="161.0">Methodology, 6 sections</text>
<text class="mu" x="362.0" y="180.0">every predictor term by term,</text>
<text class="mu" x="362.0" y="194.0">protocols and metrics</text>
<rect class="bx" x="352.0" y="216.0" width="260.0" height="66.0" rx="6"/>
<text class="hd" x="362.0" y="237.0">Implementation, 6 sections</text>
<text class="mu" x="362.0" y="256.0">data, geometry, bake, leakage, live</text>
<text class="mu" x="362.0" y="270.0">lanes, deploy</text>
<rect class="bx bx-warn" x="352.0" y="292.0" width="260.0" height="66.0" rx="6"/>
<text class="hd" x="362.0" y="313.0">Experiments and Benchmark</text>
<text class="mu" x="362.0" y="332.0">the only routes that summarise across</text>
<text class="mu" x="362.0" y="346.0">cases</text>
<rect class="bx" x="642.0" y="64.0" width="236.0" height="80.0" rx="6"/>
<text class="hd" x="652.0" y="85.0">Focus view</text>
<text class="mu" x="652.0" y="104.0">one case full screen, outside the</text>
<text class="mu" x="652.0" y="118.0">header and footer, applying the</text>
<text class="mu" x="652.0" y="132.0">theme itself</text>
<rect class="bx" x="642.0" y="154.0" width="236.0" height="66.0" rx="6"/>
<text class="hd" x="652.0" y="175.0">Every view reads values</text>
<text class="mu" x="652.0" y="194.0">readouts under the pointer, never</text>
<text class="mu" x="652.0" y="208.0">on top of the drawing</text>
<line class="flow" x1="172.0" y1="130.0" x2="172.0" y2="138.0" marker-end="url(#arch-arrow)"/>
<line class="flow" x1="172.0" y1="206.0" x2="172.0" y2="214.0" marker-end="url(#arch-arrow)"/>
<path class="flow" fill="none" d="M 262.0 64.0 V 46.0 H 682.0 V 64.0" marker-end="url(#arch-arrow)"/>
<line class="band" x1="22" y1="370.0" x2="878" y2="370.0"/>
<text class="nt" x="22" y="388.0">The static host serves a real file at each route, so a shared deep link answers 200; the build writes them. A browser gate opens every</text>
<text class="nt" x="22" y="403.0">route and every section in both themes and languages before a deploy publishes.</text>
</g>
<g class="l-es">
<text class="ttl" x="22" y="28">Seis rutas y una vista fuera del marco</text>
<rect class="bx bx-accent" x="22.0" y="64.0" width="300.0" height="66.0" rx="6"/>
<text class="hd" x="32.0" y="85.0">App: el banco de trabajo del shell</text>
<text class="mu" x="32.0" y="104.0">el caso, sus variantes, el modelo y los</text>
<text class="mu" x="32.0" y="118.0">controles del grupo abierto en el panel</text>
<rect class="bx" x="22.0" y="140.0" width="300.0" height="66.0" rx="6"/>
<text class="hd" x="32.0" y="161.0">Seis espacios, por pregunta</text>
<text class="mu" x="32.0" y="180.0">Predecir, Distribución, Diseño, Roca,</text>
<text class="mu" x="32.0" y="194.0">Comparar las variantes, El caso</text>
<rect class="bx bx-good" x="22.0" y="216.0" width="300.0" height="80.0" rx="6"/>
<text class="hd" x="32.0" y="237.0">Diseño</text>
<text class="mu" x="32.0" y="256.0">la superficie de respuesta sobre bordo y</text>
<text class="mu" x="32.0" y="270.0">espaciamiento y cada modelo sobre el diseño,</text>
<text class="mu" x="32.0" y="284.0">en vivo con los modelos ajustados del caso</text>
<rect class="bx" x="352.0" y="64.0" width="260.0" height="66.0" rx="6"/>
<text class="hd" x="362.0" y="85.0">Introducción</text>
<text class="mu" x="362.0" y="104.0">por qué importa, las relaciones, la</text>
<text class="mu" x="362.0" y="118.0">pregunta, el alcance</text>
<rect class="bx" x="352.0" y="140.0" width="260.0" height="66.0" rx="6"/>
<text class="hd" x="362.0" y="161.0">Metodología, 6 secciones</text>
<text class="mu" x="362.0" y="180.0">cada predictor término a término,</text>
<text class="mu" x="362.0" y="194.0">protocolos y métricas</text>
<rect class="bx" x="352.0" y="216.0" width="260.0" height="66.0" rx="6"/>
<text class="hd" x="362.0" y="237.0">Implementación, 6 secciones</text>
<text class="mu" x="362.0" y="256.0">datos, geometría, horneado, fuga,</text>
<text class="mu" x="362.0" y="270.0">carriles vivos, despliegue</text>
<rect class="bx bx-warn" x="352.0" y="292.0" width="260.0" height="66.0" rx="6"/>
<text class="hd" x="362.0" y="313.0">Experimentos y Benchmark</text>
<text class="mu" x="362.0" y="332.0">las únicas rutas que resumen entre</text>
<text class="mu" x="362.0" y="346.0">casos</text>
<rect class="bx" x="642.0" y="64.0" width="236.0" height="80.0" rx="6"/>
<text class="hd" x="652.0" y="85.0">Vista de foco</text>
<text class="mu" x="652.0" y="104.0">un caso a pantalla completa, fuera</text>
<text class="mu" x="652.0" y="118.0">del encabezado y el pie, aplicando</text>
<text class="mu" x="652.0" y="132.0">el tema por sí misma</text>
<rect class="bx" x="642.0" y="154.0" width="236.0" height="66.0" rx="6"/>
<text class="hd" x="652.0" y="175.0">Cada vista lee valores</text>
<text class="mu" x="652.0" y="194.0">lecturas bajo el puntero, nunca</text>
<text class="mu" x="652.0" y="208.0">sobre el dibujo</text>
<line class="flow" x1="172.0" y1="130.0" x2="172.0" y2="138.0" marker-end="url(#arch-arrow)"/>
<line class="flow" x1="172.0" y1="206.0" x2="172.0" y2="214.0" marker-end="url(#arch-arrow)"/>
<path class="flow" fill="none" d="M 262.0 64.0 V 46.0 H 682.0 V 64.0" marker-end="url(#arch-arrow)"/>
<line class="band" x1="22" y1="370.0" x2="878" y2="370.0"/>
<text class="nt" x="22" y="388.0">El hospedaje estático sirve un archivo real en cada ruta, así que un enlace profundo compartido responde 200; la compilación los</text>
<text class="nt" x="22" y="403.0">escribe. Una compuerta de navegador abre cada ruta y cada sección en ambos temas e idiomas antes de publicar.</text>
</g>
</svg>
