# Repo-local tool configuration ONLY. This product declares NO package of its own.
#
# If a package is required it is a SEPARATE REPO with a valid PyPI project, published, and consumed
# as a pinned dependency. For this product that package is `blastfrag`. There is deliberately no
# [project] block, no build backend and nothing to install from here; the pipeline is plain scripts
# invoked by path: python data-pipeline/run.py
#
# A CI guard fails the build if a [project] block ever appears in this file.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# The two generators are tables of bilingual prose and markdown rows; a long line there is a sentence,
# and wrapping it would split the text the accent guard and a reader read whole. Code elsewhere keeps
# the 110-column limit.
"scripts/build_architecture_svgs.py" = ["E501"]
"scripts/build_docs_results.py" = ["E501"]
# The template's guards, kept verbatim so they stay the base's (ADR-0078): a long line there is the template's.
"scripts/check_sdd.py" = ["E501"]
"scripts/check_content_standards.py" = ["E501"]
"scripts/check_base_integrity.py" = ["E501", "I001"]
"scripts/check_deploy_place.py" = ["E501"]
"scripts/check_web_baseline.py" = ["E501"]
"scripts/check_template_residue.py" = ["E501"]
"scripts/check_ci_budget.py" = ["E501"]
"scripts/check_doc_paths.py" = ["E501"]
"scripts/check_svg_animation.py" = ["E501"]
"scripts/check_contracts.py" = ["E501"]
"scripts/check_contract_versions.py" = ["E501"]
"scripts/check_documents.py" = ["E501"]
"scripts/check_readiness.py" = ["E501"]
"scripts/check_skeleton.py" = ["E501"]
"scripts/check_tech_matrix.py" = ["E501"]
# The planted-defect suite (template 0.08.002, adapted): the plants are one-line strings of the defect they plant, imports follow
# the template's order so a template fix applies cleanly (E741: the template's domain letters).
"tests/adversarial/*.py" = ["E501", "E741", "I001"]
