name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The deploy NEVER trains, retunes or regenerates a benchmark. It verifies the artifacts that
      # were baked deliberately and committed, then publishes them. A deployment is not an
      # experiment, and a deploy that recomputes scientific evidence has no reproducible release.
      - name: Verify the committed artifacts, never rebake them
        run: |
          pip install -r requirements-precompute.txt
          python data-pipeline/run.py --validate

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the site, with the parity gate between the two engines
        run: |
          cd frontend
          npm ci
          npm test
          npm run build

      # Publishing a site that does not render is worse than not publishing: it looks deployed.
      # This exact thing happened. Two copies of react-router meant every route threw before painting
      # a character, the deploy workflow was green, and the site served 200 on every URL for days.
      # The gate drives the built artifact in a real browser before it is allowed to become the site.
      - name: The browser gate, on the artifact about to be published
        run: |
          cd frontend
          npx playwright install --with-deps chromium
          npx vite preview --port 4173 --strictPort &
          npx wait-on http://localhost:4173 --timeout 60000
          npm run gate:browser -- --url http://localhost:4173

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
