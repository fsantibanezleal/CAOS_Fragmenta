name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The deploy NEVER trains, retunes or regenerates a benchmark. It verifies the artifacts that
      # were baked deliberately and committed, then publishes them. A deployment is not an
      # experiment, and a deploy that recomputes scientific evidence has no reproducible release.
      - name: Verify the committed artifacts, never rebake them
        run: |
          pip install -r requirements-precompute.txt
          python data-pipeline/run.py --validate

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the site, with the parity gate between the two engines
        run: |
          cd frontend
          npm ci
          npm test
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
