name: CI

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The same version the canonical bake ran on. The tests compare against committed
          # artifacts, so the environment has to be the one that produced them.
          python-version: "3.13"
          cache: pip
      # Only the linter and the test runner (requirements-dev.txt). The engine and the training
      # stack are not installed here: the tests run locally before a push (ADR-0074 rule 3), and
      # the artifacts are verified by the deploy, which installs only the engine and numpy.
      - name: Install the linter
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check data-pipeline tests scripts app
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - name: An animated SVG carries its reduced-motion block and plays ten seconds at most (shell 0.14.0, reuses the shell's analysis)
        run: python3 scripts/check_svg_animation.py
      - name: The web baseline against the installed shell (tokens, classes, numbers, animation loops; ADR-0078)
        run: python3 scripts/check_web_baseline.py
      - name: The parity gate between the browser engine and the baked numbers
        run: cd frontend && npm test
      - name: Type-check and build
        run: cd frontend && npm run build

      # The browser gate is NOT here, and that is deliberate. ADR-0074 rule 6 allows one expensive
      # verification, once, and it ran twice: here on every push and again in the deploy. It lives in
      # the deploy, because that is the one place where a failure can stop a broken site from being
      # published. A develop push is validated locally before it is made, which is the record of
      # validation under ADR-0074 rule 3:
      #   GATE_CHANNEL=chrome npm run gate:browser -- --url http://localhost:4173

  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the contract version check compares the schemas with the push's base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the web dependencies (the SDD guard validates the executive view against the shell's installed schema)
        run: cd frontend && npm ci
      - name: Install the schema validator (the SDD guard, the document check and the planted-defect suite)
        run: pip install jsonschema==4.26.0
      - name: Base-integrity guards (the template's, verbatim; a model file a catalog row declares is admitted, 0.09.000)
        run: python scripts/check_base_integrity.py

      - name: The product's own guards (no package of its own, no copyrighted sources)
        # A script rather than shell one-liners, so a developer can run the same check before
        # pushing, and so the guards themselves can be tested. They are: tests/test_guards.py.
        run: python scripts/check_guards.py

      - name: Every path a document names exists
        run: python scripts/check_doc_paths.py

      - name: Content standards, no em-dash and no emoji
        run: python scripts/check_content_standards.py

      - name: The Spanish surface carries its accents
        # The product shipped its whole Spanish body text unaccented while its own navigation read
        # correctly, so the two halves of the same page disagreed. To a Spanish reader an unaccented
        # "campana" is a bell, not a campaign.
        run: |-
          python scripts/check_spanish_accents.py

      - name: No template residue (the template's guard, verbatim)
        run: python scripts/check_template_residue.py

      - name: CI budget, trunk-only triggers, no training (ADR-0074)
        run: python scripts/check_ci_budget.py

      - name: The design document, every requirement naming a gate that exists (ADR-0075)
        run: python scripts/check_sdd.py

      - name: The notebooks, layout, English and Spanish mirror, levels, anatomy, metadata and cleanliness (static; the execution is a local gate, ADR-0074; template 0.10.000)
        run: python scripts/check_notebooks.py

      - name: The README states the repository by areas (template 0.10.000)
        run: python scripts/check_readme_areas.py

      - name: The SDD technology table is the pinned dependencies (template 0.10.000, ADR-0078)
        run: python scripts/check_tech_matrix.py

      - name: One deploy place, GitHub Pages, and no files of another (ADR-0055)
        run: python scripts/check_deploy_place.py

      - name: VERSION the single source; a version in code, never in history, fails (template 0.03.000)
        run: python scripts/check_version_coherence.py

      - name: Contract versions follow their schemas, each with its History entry, against the base (ADR-0080)
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base="$BEFORE"
          if [ -z "${base//0/}" ]; then base=origin/develop; fi  # a new branch or a manual run has no before SHA
          python scripts/check_contract_versions.py --base "$base"

      - name: Every guard rejects a planted defect (cheap, standard library and pytest only; ADR-0074)
        run: pip install pytest==9.1.1 && python -m pytest tests/adversarial -q

      - name: The contract catalog, every row complete and every path it names present (ADR-0080)
        run: python scripts/check_contracts.py docs/contracts/catalog.md --repo-root .

      - name: The readiness document is current with the catalog and the bake (ADR-0080)
        run: python scripts/check_readiness.py

      - name: Every committed document valid against its schema file (ADR-0080)
        run: python scripts/check_documents.py

      - name: Rows still served by a provider (listed while building; none on main)
        run: |
          set +e
          python scripts/check_skeleton.py docs/contracts/catalog.md
          code=$?
          set -e
          if [ "$code" -eq 2 ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "::error::main is a release: every catalog row must be real"; exit 1; fi
          [ "$code" -eq 0 ] || [ "$code" -eq 2 ]
