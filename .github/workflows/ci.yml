name: CI

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The same version the canonical bake ran on. The tests compare against committed
          # artifacts, so the environment has to be the one that produced them.
          python-version: "3.13"
          cache: pip
      - name: Install the pinned engine and the heavy lane
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check data-pipeline tests scripts
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - name: The parity gate between the browser engine and the baked numbers
        run: cd frontend && npm test
      - name: Type-check and build
        run: cd frontend && npm run build

      - name: Install the browser the gate drives
        run: cd frontend && npx playwright install --with-deps chromium

      - name: The browser gate on the BUILT site, every route, both themes, both languages
        # This job exists because everything upstream of it was green while the deployed site
        # rendered a blank page. Two copies of react-router were installed, the shell's useLocation
        # read a different context than the app's Router provided, and every route threw before
        # painting a character. Every unit test passed, every artifact validated, and the site
        # returned 200 on every URL. A 200 on a single-page app means a file was served.
        run: |
          cd frontend
          npx vite preview --port 4173 --strictPort &
          npx wait-on http://localhost:4173 --timeout 60000
          npm run gate:browser -- --url http://localhost:4173

  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Base-integrity guards
        # A script rather than shell one-liners, so a developer can run the same check before
        # pushing, and so the guards themselves can be tested. They are: tests/test_guards.py.
        run: python scripts/check_guards.py

      - name: Content standards, no em-dash and no emoji
        run: python scripts/check_content_standards.py

      - name: The Spanish surface carries its accents
        # The product shipped its whole Spanish body text unaccented while its own navigation read
        # correctly, so the two halves of the same page disagreed. To a Spanish reader an unaccented
        # "campana" is a bell, not a campaign.
        run: |-
          python scripts/check_spanish_accents.py

      - name: No template residue survived instantiation
        run: |
          fail=0
          if git ls-files | grep -q 'data-pipeline/pipeline/model/sir'; then
            echo "::error::the template example model is still here"; fail=1; fi
          if git grep -nlE '\bSIR\b|EX0[0-9]_|example_case' -- . ':!.github' >/dev/null 2>&1; then
            echo "::error::template example text survived instantiation"; fail=1; fi
          if [ "$fail" -eq 0 ]; then echo "no residue"; fi
          exit $fail

      - name: CI budget, trunk-only triggers, no training (ADR-0074)
        run: python scripts/check_ci_budget.py
