name: CI

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The same version the canonical bake ran on. The tests compare against committed
          # artifacts, so the environment has to be the one that produced them.
          python-version: "3.13"
          cache: pip
      - name: Install the pinned engine and the heavy lane
        run: pip install -r requirements-precompute.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check data-pipeline tests scripts
      - name: The pipeline tests, against the COMMITTED artifacts
        run: pytest
      - name: The release gate on what is committed
        run: python data-pipeline/run.py --validate

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - name: The parity gate between the browser engine and the baked numbers
        run: cd frontend && npm test
      - name: Type-check and build
        run: cd frontend && npm run build

      - name: Install the browser the gate drives
        run: cd frontend && npx playwright install --with-deps chromium

      - name: The browser gate on the BUILT site, every route, both themes, both languages
        # This job exists because everything upstream of it was green while the deployed site
        # rendered a blank page. Two copies of react-router were installed, the shell's useLocation
        # read a different context than the app's Router provided, and every route threw before
        # painting a character. Every unit test passed, every artifact validated, and the site
        # returned 200 on every URL. A 200 on a single-page app means a file was served.
        run: |
          cd frontend
          npx vite preview --port 4173 --strictPort &
          npx wait-on http://localhost:4173 --timeout 60000
          npm run gate:browser -- --url http://localhost:4173

  determinism:
    # Reproducibility has two halves, and they need two different instruments.
    #
    # WITHIN one environment the bake is byte-identical, and a content address is the right check.
    #
    # ACROSS environments it reproduces to a numeric tolerance, not to a hash. Two builds of the same
    # pinned numpy reduce a dot product in a different order, and the last bits differ. This job
    # measured it: baking on Linux runners against artifacts baked on Windows, with identical pins,
    # the worst difference over all sixteen cases is 2.7e-08 relative, largest on the fitted arms,
    # and the one case where every arm abstains comes out byte-identical. Asserting equal hashes
    # across machines would assert something false, so the check compares numbers and names its
    # tolerance.
    #
    # The pins and the Python version still matter, and this job earned them: the requirements file
    # originally carried version RANGES, so the runner installed different libraries from the machine
    # that baked and the numbers moved by far more than reduction order. A canonical artifact built
    # from a range is reproducible by nobody, and nothing else would have caught it.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-precompute.txt
      - name: Report the installed environment
        # Printed unconditionally. When this job fails, the first question is what was installed,
        # and reading it from a log beats guessing from a requirements file.
        run: pip list --format=freeze | grep -Ei '^(numpy|scikit-learn|scipy|xgboost|blastfrag)=' && python -VV
      # The same commands a developer runs locally, on purpose. A CI check written inline is a
      # second implementation of the check, and the two drift.
      - name: Two bakes in this environment must be byte-identical
        run: python scripts/compare_bakes.py real-murgul --repeat 2

      - name: Every case must reproduce the committed numbers to tolerance
        run: python scripts/compare_bakes.py

  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Base-integrity guards
        # A script rather than shell one-liners, so a developer can run the same check before
        # pushing, and so the guards themselves can be tested. They are: tests/test_guards.py.
        run: python scripts/check_guards.py

      - name: Content standards, no em-dash and no emoji
        run: python scripts/check_content_standards.py

      - name: The Spanish surface carries its accents
        # The product shipped its whole Spanish body text unaccented while its own navigation read
        # correctly, so the two halves of the same page disagreed. To a Spanish reader an unaccented
        # "campana" is a bell, not a campaign.
        run: |
          pip install -r requirements-precompute.txt
          python scripts/check_spanish_accents.py

      - name: No template residue survived instantiation
        run: |
          fail=0
          if git ls-files | grep -q 'data-pipeline/pipeline/model/sir'; then
            echo "::error::the template example model is still here"; fail=1; fi
          if git grep -nlE '\bSIR\b|EX0[0-9]_|example_case' -- . ':!.github' >/dev/null 2>&1; then
            echo "::error::template example text survived instantiation"; fail=1; fi
          if [ "$fail" -eq 0 ]; then echo "no residue"; fi
          exit $fail

      - name: Version coherence
        run: |
          python - <<'PY'
          import json, pathlib, re

          def norm(v):
              m = re.match(r"^v?(\d+)\.(\d+)\.(\d+)", v.strip())
              assert m, f"unparseable version {v!r}"
              return tuple(int(g) for g in m.groups())

          seen = {
              "VERSION": pathlib.Path("VERSION").read_text().strip(),
              "CHANGELOG": re.search(r"^## \[([^\]]+)\]",
                                     pathlib.Path("CHANGELOG.md").read_text(), re.M).group(1),
              "pipeline": re.search(r'^__version__\s*=\s*"([^"]+)"',
                                    pathlib.Path("data-pipeline/pipeline/__init__.py").read_text(), re.M).group(1),
              "package.json": json.loads(pathlib.Path("frontend/package.json").read_text())["version"],
          }
          assert len({norm(v) for v in seen.values()}) == 1, f"version drift: {seen}"

          index = json.loads(pathlib.Path("data/derived/manifests/index.json").read_text())
          assert norm(index["app_version"]) == norm(seen["VERSION"]), (
              f"the baked artifacts carry {index['app_version']} but the repo is {seen['VERSION']}"
          )
          print(f"OK: {seen['VERSION']}, and the artifacts agree")
          PY
